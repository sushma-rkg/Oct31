<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crow Diver</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06324f; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// Where the diver is heading
const target = { x: W / 2, y: H / 2 };
function aim(e) { target.x = e.clientX; target.y = e.clientY; }
addEventListener('pointermove', aim);
addEventListener('pointerdown', aim);

const crow = { x: W / 2, y: H / 2, vx: 0, vy: 0, face: 1 };
const croc = { x: W * 0.2, dir: 1 };
const bubbles = [];
let t = 0;

function floorY() { return H - 60; }

function drawSeaweed() {
  const n = Math.max(5, Math.floor(W / 140));
  for (let i = 0; i < n; i++) {
    const bx = (i + 0.5) * (W / n) + Math.sin(i * 7) * 20;
    const h = 90 + ((i * 53) % 70);
    ctx.strokeStyle = i % 2 ? '#2e8b57' : '#3cb371';
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, H);
    for (let s = 1; s <= 8; s++) {
      const f = s / 8;
      ctx.lineTo(bx + Math.sin(t * 1.5 + i + f * 3) * 14 * f, H - 30 - h * f);
    }
    ctx.stroke();
  }
}

function drawCroc() {
  const y = floorY() - 14;
  ctx.save();
  ctx.translate(croc.x, y + Math.sin(t * 2) * 3);
  ctx.scale(croc.dir, 1);
  ctx.fillStyle = '#4f8f3a';
  // tail
  ctx.beginPath();
  ctx.moveTo(-70, -6);
  ctx.quadraticCurveTo(-120, 10 + Math.sin(t * 4) * 10, -150, -4 + Math.sin(t * 4) * 14);
  ctx.quadraticCurveTo(-110, 4, -70, 14);
  ctx.fill();
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 75, 20, 0, 0, 7); ctx.fill();
  // snout
  ctx.beginPath(); ctx.roundRect(55, -10, 65, 20, 8); ctx.fill();
  // belly + teeth
  ctx.fillStyle = '#cfe8a8';
  ctx.beginPath(); ctx.ellipse(0, 10, 60, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(68 + i * 10, 8); ctx.lineTo(72 + i * 10, 14); ctx.lineTo(76 + i * 10, 8); ctx.fill();
  }
  // eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(52, -14, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(54, -14, 3, 0, 7); ctx.fill();
  // legs
  ctx.fillStyle = '#3f7a2e';
  ctx.fillRect(-35, 12, 14, 14); ctx.fillRect(30, 12, 14, 14);
  ctx.restore();
}

function drawCrow() {
  const flap = Math.sin(t * 9) * 0.6;
  const tilt = Math.max(-0.5, Math.min(0.5, crow.vy * 0.05)) * crow.face;
  ctx.save();
  ctx.translate(crow.x, crow.y);
  ctx.scale(crow.face, 1);
  ctx.rotate(tilt);
  // tail
  ctx.fillStyle = '#15151c';
  ctx.beginPath(); ctx.moveTo(-22, -4); ctx.lineTo(-52, -12); ctx.lineTo(-48, 6); ctx.fill();
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 28, 20, 0, 0, 7); ctx.fill();
  // wing
  ctx.fillStyle = '#26263a';
  ctx.save(); ctx.translate(-6, -4); ctx.rotate(flap);
  ctx.beginPath(); ctx.ellipse(-12, 0, 24, 9, 0, 0, 7); ctx.fill();
  ctx.restore();
  // head
  ctx.fillStyle = '#15151c';
  ctx.beginPath(); ctx.arc(24, -12, 14, 0, 7); ctx.fill();
  // beak
  ctx.fillStyle = '#d9a43c';
  ctx.beginPath(); ctx.moveTo(34, -16); ctx.lineTo(56, -8); ctx.lineTo(34, -5); ctx.fill();
  // diving goggles
  ctx.fillStyle = 'rgba(150,230,255,0.85)';
  ctx.strokeStyle = '#e8b93a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(29, -15, 7, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(31, -15, 2.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e8b93a'; ctx.beginPath(); ctx.moveTo(22, -17); ctx.lineTo(12, -14); ctx.stroke();
  // feet
  ctx.strokeStyle = '#d9a43c'; ctx.lineWidth = 3;
  const k = Math.sin(t * 9) * 5;
  ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(-14 - k, 28); ctx.moveTo(6, 18); ctx.lineTo(-2 + k, 28); ctx.stroke();
  ctx.restore();
}

function step() {
  t += 0.016;

  // Crow glides toward the pointer
  const dx = target.x - crow.x, dy = target.y - crow.y;
  const dist = Math.hypot(dx, dy);
  crow.vx += dx * 0.004; crow.vy += dy * 0.004;
  crow.vx *= 0.93; crow.vy *= 0.93;
  crow.x += crow.vx; crow.y += crow.vy;
  crow.y = Math.min(crow.y, floorY() - 20);
  if (Math.abs(dx) > 8) crow.face = dx > 0 ? 1 : -1;

  // Crocodile patrols back and forth
  croc.x += croc.dir * 0.8;
  if (croc.x > W - 140) croc.dir = -1;
  if (croc.x < 140) croc.dir = 1;

  // Bubbles rise from the crow's beak area
  if (Math.random() < 0.15 + Math.min(0.3, dist / 800)) {
    bubbles.push({
      x: crow.x + crow.face * 38, y: crow.y - 10,
      r: 2 + Math.random() * 5, ph: Math.random() * 6, life: 1
    });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= 0.8 + b.r * 0.2;
    b.x += Math.sin(t * 3 + b.ph) * 0.5;
    b.life -= 0.004;
    if (b.life <= 0 || b.y < -10) bubbles.splice(i, 1);
  }

  // Draw
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4fc3f7'); g.addColorStop(1, '#06324f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#d8c28a'; ctx.fillRect(0, floorY() + 30, W, H);
  drawSeaweed();
  drawCroc();
  drawCrow();
  for (const b of bubbles) {
    ctx.globalAlpha = Math.min(1, b.life);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
